# Зеркало biorise-clinic.ru под вторым доменом (biorise-clinics.ru).
# Отдаёт ТЕ ЖЕ файлы (root совпадает с основным сайтом), но намеренно
# закрыт от индексации через X-Robots-Tag (не через robots.txt - см.
# обоснование в истории чата: Disallow в robots.txt мешает краулеру
# дойти до страницы и прочитать noindex, поэтому используем только
# заголовок на уровне nginx). Canonical на всех страницах и так
# абсолютный и указывает на biorise-clinic.ru, так что это двойная
# подстраховка.

server {
    server_name biorise-clinics.ru;

    root /var/www/biorise-clinic;
    index index.html;

    error_page 404 /404.html;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /yandex-doctors-feed.yml {
        default_type application/xml;
    }

    # Та же защита Basic Auth, что и на основном домене (см.
    # biorise-clinic.conf) - зеркало отдаёт те же файлы и тот же API,
    # закрытый раздел с данными пациентов не должен быть доступен
    # без пароля ни с одного из двух доменов.
    location ^~ /direct-tracker {
        auth_basic "BIORISE - закрытый раздел";
        auth_basic_user_file /etc/nginx/.htpasswd-direct-tracker;
        limit_req zone=biorise_perip burst=30 nodelay;
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    location /api/direct-tracker/ {
        auth_basic "BIORISE - закрытый раздел";
        auth_basic_user_file /etc/nginx/.htpasswd-direct-tracker;
        proxy_pass http://127.0.0.1:8090/api/direct-tracker/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8090/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=biorise_perip burst=30 nodelay;
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    location = /404.html {
        internal;
    }

    location /_next/static/ {
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/biorise-clinics.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/biorise-clinics.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = biorise-clinics.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name biorise-clinics.ru;
    return 404; # managed by Certbot
}
