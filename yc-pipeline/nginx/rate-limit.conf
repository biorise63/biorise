# Базовая защита от массового автоматического обхода (скрейперы, агрессивные
# краулеры) - живёт в http{} через /etc/nginx/conf.d/*.conf.
#
# 10r/s на IP с запасом burst=30 без задержки (nodelay) - обычная загрузка
# страницы человеком (HTML + параллельные запросы браузера) укладывается
# в эту пачку без единого отказа. Реальные поисковые боты (Googlebot,
# YandexBot) при таком лимите тоже не страдают: они сами снижают скорость
# при 429-х, это ожидаемое и безопасное для индексации поведение.
#
# Применяется в yc-pipeline/nginx/biorise-clinic.conf, location / (see
# limit_req zone=biorise_perip ...).
limit_req_zone $binary_remote_addr zone=biorise_perip:10m rate=10r/s;
limit_req_status 429;
