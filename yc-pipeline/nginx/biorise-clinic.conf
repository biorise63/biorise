server {
    server_name biorise-clinic.ru www.biorise-clinic.ru;

    root /var/www/biorise-clinic;
    index index.html;

    error_page 404 /404.html;


    location = /yandex-doctors-feed.yml {
        default_type application/xml;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8090/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=biorise_perip burst=30 nodelay;
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    location = /404.html {
        internal;
    }

    location /_next/static/ {
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/biorise-clinic.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/biorise-clinic.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.biorise-clinic.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = biorise-clinic.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name biorise-clinic.ru www.biorise-clinic.ru;
    return 404; # managed by Certbot




}